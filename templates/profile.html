<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль - Карта битв</title>
    <link rel="stylesheet" href="/static/style_prof.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <img src="/static/avatars/{{ user.avatar }}" alt="Аватар" class="avatar" onerror="this.src='/static/avatars/default_avatar.png'">
            <h2>Профиль пользователя</h2>
            <p style="color: #aaa;">{{ user.username }}</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email or '' }}">
            </div>
            <div class="form-group">
                <label>ФИО</label>
                <input type="text" name="full_name" value="{{ user.full_name or '' }}">
            </div>
            <div class="form-group">
                <label>Аватар</label>
                <input type="file" name="avatar" accept="image/*">
                <small style="color: #aaa;">Поддерживаются: PNG, JPG, JPEG, GIF, WEBP (до 5MB)</small>
            </div>
            <button type="submit">Сохранить изменения</button>
        </form>
        <div class="profile-links">
            <a href="{{ url_for('home') }}">← Вернуться на главную</a>
            <a href="{{ url_for('logout') }}">🚪 Выйти</a>
        </div>
    </div>
</body>
</html>
